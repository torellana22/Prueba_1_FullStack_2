<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi carrito | NodoPC</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor barra">
      <a class="logo" href="index.html">
        <img src="img/logo.svg" alt="Logo de NodoPC" width="36" height="36">
        <span>NodoPC</span>
      </a>
      <nav class="menu" aria-label="Menú principal">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="blogs.html">Blogs</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div class="acciones">
        <a href="login.html">Iniciar sesión</a>
        <a href="registro.html">Registrar usuario</a>
        <a href="carrito.html" class="carrito">Carrito (<span id="contador-carrito">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <h1 class="titulo-pagina">Mi carrito de compras</h1>

    <div id="carrito-items" class="carrito-items"></div>

    <div id="carrito-vacio" class="oculto">
      <div class="carrito-vacio">
        <p>Tu carrito está vacío.</p>
        <a class="boton boton-grande" href="productos.html">Ver productos</a>
      </div>
    </div>

    <div id="carrito-resumen" class="oculto">
      <button id="boton-vaciar" class="boton boton-secundario">Vaciar carrito</button>
      <span class="total-etiqueta">Total</span>
      <span id="carrito-total" class="total-numero">$0</span>
      <button class="boton boton-grande">Pagar</button>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p class="pie-nombre">NodoPC</p>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/productos-datos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/carrito-pagina.js"></script>
</body>
</html>

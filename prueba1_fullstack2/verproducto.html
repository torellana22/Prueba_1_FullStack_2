<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Detalle de Producto</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="sidebar">
            <div class="logo-container">
                <p class="logo"><i class="fa-solid fa-compass"></i> Company</p>
            </div>

            <nav class="nav-main">
                <a href="index.html"><i class="fa-solid fa-border-all"></i> Dashboard</a>
                <a href="productos.html" class="active"><i class="fa-solid fa-box"></i> Productos</a>
                <a href="clientes.html"><i class="fa-solid fa-users"></i> Clientes / Usuarios</a>
                <a href="#"><i class="fa-solid fa-file-lines"></i> Reportes</a>
                <a href="#"><i class="fa-solid fa-user-tie"></i> Empleados</a>
            </nav>

            <nav class="nav-bottom">
                <a href="#"><i class="fa-solid fa-gear"></i> Configuración</a>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a>
                <a href="#"><i class="fa-solid fa-circle-question"></i> Ayuda</a>
                <a href="#" class="profile-link"><i class="fa-solid fa-circle-user"></i> Admin</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>¡HOLA Administrador!</h2>
                <div class="header-icons">
                    <i class="fa-regular fa-bell"></i>
                </div>
            </header>

            <section class="content-body">
                <h1 class="form-title">DETALLE DEL PRODUCTO</h1>

                <div class="form-card">
                    <div class="form-header-bar">Información: PROD-001</div>
                    
                    <div class="user-form">
                        <div class="form-group">
                            <label>CÓDIGO DE PRODUCTO</label>
                            <input type="text" value="PROD-001" disabled>
                        </div>

                        <div class="form-group">
                            <label>NOMBRE DEL PRODUCTO</label>
                            <input type="text" value="Teclado Mecánico RGB" disabled>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>CATEGORÍA</label>
                                <input type="text" value="Periféricos" disabled>
                            </div>
                            <div class="form-group">
                                <label>STOCK DISPONIBLE</label>
                                <input type="text" value="15 unidades" disabled>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>PRECIO</label>
                            <input type="text" value="$45.000" disabled>
                        </div>

                        <div class="form-group">
                            <label>DESCRIPCIÓN</label>
                            <textarea rows="4" style="width: 100%; border: 1px solid #999; padding: 8px;" disabled>Teclado mecánico retroiluminado con switches red y conexión USB desmontable.</textarea>
                        </div>

                        <div class="form-actions">
                            <a href="productos.html" class="btn-outline" style="text-decoration: none; text-align: center; color: #000;">VOLVER AL LISTADO</a>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Nuevo Usuario</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="sidebar">
            <div class="logo-container">
                <p class="logo"><i class="fa-solid fa-compass"></i> Company</p>
            </div>

            <nav class="nav-main">
                <a href="index.html"><i class="fa-solid fa-border-all"></i> Dashboard</a>
                <a href="clientes.html" class="active"><i class="fa-solid fa-users"></i> Clientes / Usuarios</a>
                <a href="productos.html"><i class="fa-solid fa-box"></i> Productos</a>
                <a href="#"><i class="fa-solid fa-box"></i> Inventario</a>
                <a href="#"><i class="fa-solid fa-file-lines"></i> Reportes</a>
                <a href="#"><i class="fa-solid fa-user-tie"></i> Empleados</a>
            </nav>

            <nav class="nav-bottom">
                <a href="#"><i class="fa-solid fa-gear"></i> Configuración</a>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a>
                <a href="#"><i class="fa-solid fa-circle-question"></i> Ayuda</a>
                <a href="#" class="profile-link"><i class="fa-solid fa-circle-user"></i> Admin</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>¡HOLA Administrador!</h2>
                <div class="header-icons">
                    <i class="fa-regular fa-bell"></i>
                </div>
            </header>

            <section class="content-body">
                <h1 class="form-title">NUEVO USUARIO</h1>

                <div class="form-card">
                    <div class="form-header-bar">Registro de usuario</div>
                    
                    <form class="user-form" action="clientes.html">
                        <div class="form-group">
                            <label>NOMBRE COMPLETO</label>
                            <input type="text" required>
                        </div>

                        <div class="form-group">
                            <label>CORREO</label>
                            <input type="email" required>
                        </div>

                        <div class="form-group">
                            <label>CORREO (CONFIRMACIÓN)</label>
                            <input type="email" required>
                        </div>

                        <div class="form-group">
                            <label>CONTRASEÑA</label>
                            <input type="password" required>
                        </div>

                        <div class="form-group">
                            <label>CONFIRMAR CONTRASEÑA</label>
                            <input type="password" required>
                        </div>

                        <div class="form-group">
                            <label>TELÉFONO (opcional)</label>
                            <input type="tel">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <select required>
                                    <option value="">- Seleccione la región -</option>
                                    <option>Región Metropolitana de Santiago</option>
                                    <option>Región de la Araucanía</option>
                                    <option>Región de Ñuble</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <select required>
                                    <option value="">- Seleccione la comuna -</option>
                                    <option>Linares</option>
                                    <option>Longaví</option>
                                    <option>Concepción</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-outline">REGISTRAR</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

    </div>

</body>
</html>
